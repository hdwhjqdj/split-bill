<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e9e3d6">
<title>拼单计算器</title>
<style>
  :root{
    --bg:#e9e3d6;
    --paper:#fffdf5;
    --ink:#2b2a26;
    --ink2:#5d584e;
    --muted:#948c7c;
    --line:#e8dcc8;
    --red:#d4553a;
    --green:#3f7a52;
    --gold:#b08a3e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(700px 500px at 50% -10%, #f6f1e6 0%, rgba(246,241,230,0) 60%),
      repeating-linear-gradient(0deg, rgba(120,105,80,.05) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(120,105,80,.05) 0 1px, transparent 1px 26px),
      #e9e3d6;
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums}
  button{font-family:inherit; font-size:inherit; color:inherit; border:none; background:none; cursor:pointer; touch-action:manipulation}
  input{font-family:inherit; font-size:inherit; color:inherit}
  .app{max-width:520px; margin:0 auto; padding:calc(22px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}

  .topbar{text-align:center; margin-bottom:16px}
  .brand{font-size:10px; letter-spacing:.34em; color:var(--gold); font-weight:800; margin-bottom:8px}
  .topbar h1{margin:0; font-size:clamp(26px,8vw,34px); font-weight:900; letter-spacing:-.5px}
  .sub{margin:8px 0 0; font-size:12.5px; color:var(--muted)}

  /* 小票纸张 */
  .receipt{
    position:relative; background:var(--paper); border-radius:8px;
    padding:22px 18px 20px;
    box-shadow:0 18px 40px -22px rgba(90,74,44,.55), 0 4px 10px -6px rgba(90,74,44,.25);
  }
  .receipt::before{
    content:""; position:absolute; left:6px; right:6px; top:-10px; height:20px;
    background-image:radial-gradient(circle at 50% 100%, var(--bg) 0 8.5px, transparent 9px);
    background-size:18px 20px; background-repeat:repeat-x;
    pointer-events:none;
  }
  .receipt::after{
    content:""; position:absolute; left:6px; right:6px; bottom:-10px; height:20px;
    background-image:radial-gradient(circle at 50% 0%, var(--bg) 0 8.5px, transparent 9px);
    background-size:18px 20px; background-repeat:repeat-x;
    pointer-events:none;
  }

  .r-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding-bottom:12px}
  .shop{font-size:19px; font-weight:900; letter-spacing:3px}
  .meta{font-size:10.5px; color:var(--muted); text-align:right; line-height:1.6; white-space:pre-line}
  .dash{height:1px; margin:16px 0; background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px)}

  .sec{margin-bottom:4px}
  .sec-title{
    display:flex; align-items:center; gap:8px;
    font-size:10.5px; font-weight:900; letter-spacing:.22em; color:var(--muted); margin:0 0 12px;
  }
  .sec-title::after{content:""; flex:1; height:1px; background:var(--line)}

  /* 成员行 */
  .prow{
    display:grid; grid-template-columns:1fr 116px 30px; gap:8px; align-items:center;
    padding:6px 0;
  }
  .prow input{
    width:100%; min-height:44px; padding:8px 12px;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .prow input:focus{border-color:#c9b48a; box-shadow:0 0 0 3px rgba(176,138,62,.16)}
  .prow .pamt{text-align:right; font-weight:800; letter-spacing:.5px}
  .prow .pamt::placeholder{font-weight:400; letter-spacing:0}
  .prow .del{
    width:30px; height:30px; border-radius:9px; color:#a89a80; font-size:18px; line-height:1;
  }
  .prow .del:active{background:#f4ecdd}
  .add{
    width:100%; min-height:42px; margin-top:8px; border-radius:10px;
    border:1px dashed #d7c6a8; color:var(--ink2); font-size:13px; font-weight:700;
    background:#fffdf6;
  }
  .add:active{background:#f7f0e2}

  /* 费用行 */
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0}
  .row label{font-size:13.5px; color:var(--ink2)}
  .row input{
    width:132px; min-height:44px; padding:8px 12px; text-align:right; font-weight:800;
    background:#fff; border:1px solid var(--line); border-radius:10px; outline:none;
    font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums;
  }
  .row input:focus{border-color:#c9b48a; box-shadow:0 0 0 3px rgba(176,138,62,.16)}

  .field{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0 2px; flex-wrap:wrap}
  .lbl{font-size:12px; color:var(--muted); font-weight:700}
  .seg{display:flex; gap:4px; padding:3px; border-radius:12px; background:#f5eee1; border:1px solid var(--line)}
  .seg button{
    padding:7px 12px; border-radius:9px; font-size:12px; font-weight:700; color:var(--ink2);
  }
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 2px 6px -2px rgba(90,74,44,.35)}

  /* 汇总 */
  .sum{padding:12px 0 2px}
  .sum .line{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; font-size:13.5px; color:var(--ink2)}
  .sum .line b{font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums; font-size:15px; color:var(--ink)}
  .sum .line.minus b{color:var(--green)}
  .sum .line.big{
    margin-top:8px; padding-top:12px; border-top:2px solid var(--ink);
    font-size:14px; font-weight:900; color:var(--ink);
  }
  .sum .line.big b{font-size:22px; letter-spacing:.5px}

  /* 明细 */
  .drow{
    display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center;
    padding:7px 0; border-bottom:1px dashed var(--line);
  }
  .drow:last-child{border-bottom:none}
  .drow .dn{font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px}
  .tag{
    font-size:9.5px; font-weight:900; letter-spacing:.08em; color:#fff; padding:2px 6px; border-radius:5px;
    background:var(--red);
  }
  .drow .dm{font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums; font-size:15px; font-weight:800}
  .drow .pay{
    font-size:10.5px; font-weight:800; color:var(--gold); border:1px solid #e3cf9f; background:#fffaf0;
    padding:4px 8px; border-radius:8px;
  }
  .drow.is-payer .dm{color:var(--red)}

  .transfers{display:flex; flex-direction:column; gap:9px}
  .tline{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13.5px}
  .tline .amt{font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums; font-weight:900; font-size:16px; color:var(--red)}
  .tline .who b{font-weight:800}
  .none{font-size:12.5px; color:var(--muted)}
  .payer-note{font-size:11.5px; color:var(--muted); margin:10px 0 0; line-height:1.8}

  .sign-row{display:flex; justify-content:flex-end; padding:6px 4px 2px}
  .stamp{
    transform:rotate(-9deg);
    border:2.5px solid rgba(212,85,58,.6); color:rgba(212,85,58,.7);
    font-size:11px; font-weight:900; letter-spacing:.22em; padding:6px 10px; border-radius:6px;
    opacity:.85; pointer-events:none;
  }

  .btn-copy{
    width:100%; min-height:52px; margin-top:6px; border-radius:12px;
    background:var(--ink); color:#fff9ec; font-size:15px; font-weight:900; letter-spacing:.1em;
  }
  .btn-copy:active{transform:translateY(1px)}
  .btn-reset{
    width:100%; min-height:46px; margin-top:10px; border-radius:12px;
    border:1px solid var(--line); color:var(--ink2); font-size:13px; font-weight:700; background:#fffdf6;
  }
  .foot{text-align:center; font-size:11px; color:var(--muted); margin-top:18px; line-height:1.9}
  .warn{font-size:11.5px; color:var(--red); margin:6px 0 0; min-height:0}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand mono">SPLIT.IT / 拼单台</div>
    <h1>拼单计算器</h1>
    <p class="sub">谁点多少、谁该转多少，一次算清</p>
  </header>

  <main class="receipt">
    <div class="r-head">
      <div class="shop">拼单小票</div>
      <div class="meta mono" id="meta"></div>
    </div>

    <section class="sec">
      <div class="sec-title">成员与金额</div>
      <div id="people"></div>
      <button class="add" id="add">+ 添加一个人</button>
    </section>

    <div class="dash"></div>

    <section class="sec">
      <div class="sec-title">优惠与运费</div>
      <div class="row">
        <label>优惠金额（满减 / 券）</label>
        <input id="discount" inputmode="decimal" value="12" class="mono">
      </div>
      <div class="row">
        <label>运费 / 打包费</label>
        <input id="ship" inputmode="decimal" value="9" class="mono">
      </div>
      <div class="field">
        <span class="lbl">优惠怎么分</span>
        <div class="seg" data-key="dmode">
          <button data-v="ratio" class="on">按金额比例</button>
          <button data-v="even">平均分</button>
        </div>
      </div>
      <div class="field">
        <span class="lbl">运费怎么分</span>
        <div class="seg" data-key="smode">
          <button data-v="even" class="on">平均分</button>
          <button data-v="ratio">按金额比例</button>
        </div>
      </div>
      <div class="warn" id="warn"></div>
    </section>

    <div class="dash"></div>

    <section class="sum">
      <div class="line"><span>总单</span><b id="s-total">¥0.00</b></div>
      <div class="line minus"><span>优惠</span><b id="s-discount">-¥0.00</b></div>
      <div class="line"><span>运费</span><b id="s-ship">+¥0.00</b></div>
      <div class="line big"><span>应收合计</span><b id="s-pay">¥0.00</b></div>
    </section>

    <div class="dash"></div>

    <section class="sec">
      <div class="sec-title">每人应付</div>
      <div id="detail"></div>
      <p class="payer-note">点右边的「垫付」可以指定谁先付钱</p>
    </section>

    <div class="dash"></div>

    <section class="sec">
      <div class="sec-title">转账清单</div>
      <div id="transfers" class="transfers"></div>
    </section>

    <div class="sign-row"><div class="stamp">已 拼 单</div></div>
    <button class="btn-copy" id="copy">复制账单文字</button>
    <button class="btn-reset" id="reset">清空重来</button>
    <p class="foot">金额按分计算，尾差已自动补齐<br>娱乐之外，是能真的用的工具</p>
  </main>

  <p class="foot">数据只存在你自己的手机里 · 刷新即清空</p>
</div>

<script>
(function(){
  "use strict";

  var state = {
    people: [
      { name:"阿花", amt:"58", },
      { name:"小李", amt:"32" },
      { name:"老王", amt:"24" }
    ],
    discount: "12",
    ship: "9",
    dmode: "ratio",
    smode: "even",
    payer: 0
  };

  var $ = function(id){ return document.getElementById(id); };

  function toCents(v){
    var s = String(v == null ? "" : v).replace(/[^\d.]/g, "");
    if(!s) return 0;
    var f = parseFloat(s);
    if(!isFinite(f) || f < 0) return 0;
    return Math.round(f * 100);
  }
  function yuan(c){ return "¥" + (c/100).toFixed(2); }
  function plain(c){ return (c/100).toFixed(2); }
  function money(v){ return v ? String(v) : ""; }

  function splitPool(pool, weights, mode){
    var n = weights.length, out = new Array(n), i, j;
    for(i=0;i<n;i++) out[i] = 0;
    if(n === 0 || pool <= 0) return out;

    var total = 0, elig = [];
    for(i=0;i<n;i++){
      total += weights[i];
      if(weights[i] > 0) elig.push(i);
    }
    if(!elig.length) return out;

    if(mode === "even" || total <= 0){
      var left = pool, act = elig.slice();
      while(left > 0 && act.length){
        var base = Math.floor(left / act.length), extra = left % act.length, moved = 0;
        for(j=0;j<act.length;j++){
          var idx = act[j];
          var want = base + (j < extra ? 1 : 0);
          var room = weights[idx] - out[idx];
          var give = Math.min(want, room, left - moved);
          out[idx] += give;
          moved += give;
        }
        left -= moved;
        act = act.filter(function(k){ return out[k] < weights[k]; });
        if(moved === 0) break;
      }
      return out;
    }

    var given = 0;
    for(i=0;i<elig.length;i++){
      j = elig[i];
      out[j] = Math.floor(pool * weights[j] / total);
      given += out[j];
    }
    var rest = pool - given;
    var order = elig.slice();
    order.sort(function(a,b){ return weights[b] - weights[a] || a - b; });
    for(i=0;i<rest;i++) out[order[i % order.length]] += 1;
    return out;
  }

  function compute(){
    var list = state.people.map(function(p, i){
      return { name: (p.name || "成员" + (i+1)), amt: toCents(p.amt), raw: p.amt };
    });
    var total = 0, i;
    for(i=0;i<list.length;i++) total += list[i].amt;

    var discInput = toCents(state.discount);
    var discWanted = discInput;
    var disc = Math.min(discInput, total);
    var cut = discWanted > total;
    var ship = toCents(state.ship);

    var weights = list.map(function(x){ return x.amt; });
    var dShare = splitPool(disc, weights, state.dmode);
    var sShare = splitPool(ship, weights, state.smode);

    var rows = list.map(function(x, k){
      return {
        name: x.name,
        amt: x.amt,
        disc: dShare[k],
        ship: sShare[k],
        due: x.amt - dShare[k] + sShare[k]
      };
    });

    var payerIdx = Math.min(state.payer, Math.max(rows.length - 1, 0));
    var dueTotal = 0;
    for(i=0;i<rows.length;i++) dueTotal += rows[i].due;

    return { rows:rows, total:total, disc:disc, discWanted:discWanted, cut:cut, ship:ship, dueTotal:dueTotal, payerIdx:payerIdx };
  }

  function renderPeople(){
    var box = $("people");
    box.innerHTML = "";
    state.people.forEach(function(p, i){
      var row = document.createElement("div");
      row.className = "prow";

      var name = document.createElement("input");
      name.className = "pname";
      name.value = p.name;
      name.placeholder = "成员" + (i+1);
      name.maxLength = 8;
      name.oninput = function(){ p.name = name.value; update(); };

      var amt = document.createElement("input");
      amt.className = "pamt mono";
      amt.inputMode = "decimal";
      amt.value = p.amt;
      amt.placeholder = "0.00";
      amt.oninput = function(){ p.amt = amt.value; update(); };

      var del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.setAttribute("aria-label", "删除这一行");
      del.onclick = function(){
        if(state.people.length <= 1) return;
        state.people.splice(i, 1);
        if(state.payer >= state.people.length) state.payer = 0;
        renderPeople();
        update();
      };

      row.appendChild(name);
      row.appendChild(amt);
      row.appendChild(del);
      box.appendChild(row);
    });
  }

  function renderResult(r){
    $("s-total").textContent = yuan(r.total);
    $("s-discount").textContent = "-" + yuan(r.disc);
    $("s-ship").textContent = "+" + yuan(r.ship);
    $("s-pay").textContent = yuan(r.dueTotal);

    $("warn").textContent = r.cut ? "优惠填得比总单还高，已按总单封顶" : "";

    var dbox = $("detail");
    dbox.innerHTML = "";
    r.rows.forEach(function(x, i){
      var row = document.createElement("div");
      row.className = "drow" + (i === r.payerIdx ? " is-payer" : "");

      var n = document.createElement("div");
      n.className = "dn";
      n.textContent = x.name;
      if(i === r.payerIdx){
        var tg = document.createElement("span");
        tg.className = "tag";
        tg.textContent = "垫付";
        n.appendChild(tg);
      }

      var m = document.createElement("div");
      m.className = "dm";
      m.textContent = yuan(x.due);

      var b = document.createElement("button");
      b.className = "pay";
      b.textContent = i === r.payerIdx ? "就是TA" : "垫付";
      b.onclick = function(){ state.payer = i; update(); };

      row.appendChild(n);
      row.appendChild(m);
      row.appendChild(b);
      dbox.appendChild(row);
    });

    var tbox = $("transfers");
    tbox.innerHTML = "";
    var payerName = r.rows.length ? r.rows[r.payerIdx].name : "";
    var others = r.rows.filter(function(x, i){ return i !== r.payerIdx && x.due > 0; });
    if(!r.rows.length){
      tbox.innerHTML = '<p class="none">先添加成员和金额</p>';
    } else if(!others.length){
      tbox.innerHTML = '<p class="none">只有一个人，不需要转账</p>';
    } else {
      others.forEach(function(x){
        var line = document.createElement("div");
        line.className = "tline";
        line.innerHTML = '<div class="who"><b>' + x.name + '</b> 转给 <b>' + payerName + '</b></div>' +
                        '<div class="amt">' + yuan(x.due) + '</div>';
        tbox.appendChild(line);
      });
      var note = document.createElement("p");
      note.className = "payer-note";
      note.textContent = payerName + " 先付 " + yuan(r.dueTotal) + "，其他人转完刚好两清。";
      tbox.appendChild(note);
    }
  }

  function update(){
    renderResult(compute());
  }

  function buildText(){
    var r = compute();
    var L = [];
    L.push("【拼单账单】");
    L.push("总单 " + yuan(r.total));
    if(r.disc) L.push("优惠 -" + yuan(r.disc));
    if(r.ship) L.push("运费 +" + yuan(r.ship));
    L.push("应收合计 " + yuan(r.dueTotal));
    L.push("----------");
    r.rows.forEach(function(x){
      L.push(x.name + "  " + yuan(x.due));
    });
    var payerName = r.rows.length ? r.rows[r.payerIdx].name : "";
    if(r.rows.length > 1){
      L.push("----------");
      L.push("由 " + payerName + " 先垫付 " + yuan(r.dueTotal) + "，其他人转给 TA");
    }
    return L.join("\n");
  }

  $("add").onclick = function(){
    state.people.push({ name:"", amt:"" });
    renderPeople();
    var inputs = $("people").querySelectorAll(".prow");
    var last = inputs[inputs.length - 1];
    if(last) last.querySelector(".pname").focus();
    update();
  };

  $("discount").oninput = function(){ state.discount = this.value; update(); };
  $("ship").oninput = function(){ state.ship = this.value; update(); };

  var segs = document.querySelectorAll(".seg");
  for(var s=0;s<segs.length;s++){
    (function(seg){
      var key = seg.getAttribute("data-key");
      var btns = seg.querySelectorAll("button");
      for(var b=0;b<btns.length;b++){
        btns[b].onclick = function(){
          for(var k=0;k<btns.length;k++) btns[k].classList.remove("on");
          this.classList.add("on");
          state[key] = this.getAttribute("data-v");
          update();
        };
      }
    })(segs[s]);
  }

  $("copy").onclick = function(){
    var txt = buildText();
    var btn = $("copy");
    var done = function(){
      btn.textContent = "已复制，去粘到群里";
      setTimeout(function(){ btn.textContent = "复制账单文字"; }, 1800);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ alert(txt); });
    } else {
      alert(txt);
    }
  };

  $("reset").onclick = function(){
    state.people = [{ name:"", amt:"" }];
    state.discount = "0";
    state.ship = "0";
    state.payer = 0;
    $("discount").value = "0";
    $("ship").value = "0";
    renderPeople();
    update();
  };

  var d = new Date();
  var pad = function(n){ return n < 10 ? "0" + n : "" + n; };
  $("meta").textContent = d.getFullYear() + "." + pad(d.getMonth()+1) + "." + pad(d.getDate()) + "\nNO." + pad(d.getHours()) + pad(d.getMinutes());

  state.discount = $("discount").value;
  state.ship = $("ship").value;

  renderPeople();
  update();
})();
</script>
</body>
</html>
