<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e9e3d6">
<title>拼单计算器</title>
<style>
  :root{
    --bg:#e9e3d6;
    --paper:#fffdf5;
    --ink:#2b2a26;
    --ink2:#5d584e;
    --muted:#948c7c;
    --line:#e8dcc8;
    --red:#d4553a;
    --green:#3f7a52;
    --gold:#b08a3e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(700px 500px at 50% -10%, #f6f1e6 0%, rgba(246,241,230,0) 60%),
      repeating-linear-gradient(0deg, rgba(120,105,80,.05) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(120,105,80,.05) 0 1px, transparent 1px 26px),
      #e9e3d6;
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums}
  button{font-family:inherit; font-size:inherit; color:inherit; border:none; background:none; cursor:pointer; touch-action:manipulation}
  input,select{font-family:inherit; font-size:inherit; color:inherit}
  .app{max-width:520px; margin:0 auto; padding:calc(22px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}

  .topbar{text-align:center; margin-bottom:16px}
  .brand{font-size:10px; letter-spacing:.34em; color:var(--gold); font-weight:800; margin-bottom:8px}
  .topbar h1{margin:0; font-size:clamp(26px,8vw,34px); font-weight:900; letter-spacing:-.5px}
  .sub{margin:8px 0 0; font-size:12.5px; color:var(--muted)}

  .receipt{
    position:relative; background:var(--paper); border-radius:8px;
    padding:22px 18px 20px;
    box-shadow:0 18px 40px -22px rgba(90,74,44,.55), 0 4px 10px -6px rgba(90,74,44,.25);
  }
  .receipt::before{
    content:""; position:absolute; left:6px; right:6px; top:-10px; height:20px;
    background-image:radial-gradient(circle at 50% 100%, var(--bg) 0 8.5px, transparent 9px);
    background-size:18px 20px; background-repeat:repeat-x; pointer-events:none;
  }
  .receipt::after{
    content:""; position:absolute; left:6px; right:6px; bottom:-10px; height:20px;
    background-image:radial-gradient(circle at 50% 0%, var(--bg) 0 8.5px, transparent 9px);
    background-size:18px 20px; background-repeat:repeat-x; pointer-events:none;
  }

  .r-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding-bottom:12px}
  .shop{font-size:19px; font-weight:900; letter-spacing:3px}
  .meta{font-size:10.5px; color:var(--muted); text-align:right; line-height:1.6; white-space:pre-line}
  .dash{height:1px; margin:16px 0; background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px)}

  .sec{margin-bottom:4px}
  .sec-title{
    display:flex; align-items:center; gap:8px;
    font-size:10.5px; font-weight:900; letter-spacing:.22em; color:var(--muted); margin:0 0 12px;
  }
  .sec-title::after{content:""; flex:1; height:1px; background:var(--line)}

  /* 表单通用 */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .fld{display:flex; flex-direction:column; gap:5px}
  .fld span{font-size:11px; color:var(--muted); font-weight:700}
  .fld.full{grid-column:1/-1; margin-top:4px}
  .fld input,.fld select{
    width:100%; min-height:42px; padding:8px 11px; background:#fff;
    border:1px solid var(--line); border-radius:10px; outline:none;
    transition:border-color .15s, box-shadow .15s; font-size:13.5px;
  }
  .fld input:focus,.fld select:focus,.pcard input:focus,.pcard select:focus{border-color:#c9b48a; box-shadow:0 0 0 3px rgba(176,138,62,.16)}
  select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,#a89a80 50%),linear-gradient(135deg,#a89a80 50%,transparent 50%); background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px}

  /* 成员 */
  .pcard{
    display:grid; grid-template-columns:1fr 86px 72px 26px; gap:6px; align-items:center;
    padding-top:8px;
  }
  .pcard input,.pcard select{
    width:100%; min-height:44px; padding:8px 10px; background:#fff;
    border:1px solid var(--line); border-radius:10px; outline:none;
  }
  .pcard .pamt{text-align:right; font-weight:800; letter-spacing:.4px; font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace}
  .pcard .pcur{font-size:12px; padding:8px 4px 8px 8px; background-position:calc(100% - 12px) 19px,calc(100% - 8px) 19px}
  .pcard .del{width:26px; height:30px; color:#a89a80; font-size:18px; line-height:1; border-radius:8px}
  .pcard .del:active{background:#f4ecdd}
  .pcard .pnote{grid-column:1/-1; min-height:36px; font-size:12px; color:var(--ink2); background:#fffdf6}
  .pcard .pnote::placeholder{color:#b3a893}
  .add{
    width:100%; min-height:42px; margin-top:10px; border-radius:10px;
    border:1px dashed #d7c6a8; color:var(--ink2); font-size:13px; font-weight:700; background:#fffdf6;
  }
  .add:active{background:#f7f0e2}

  /* 费用 */
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0}
  .row label{font-size:13.5px; color:var(--ink2)}
  .row input{width:132px; min-height:44px; padding:8px 12px; text-align:right; font-weight:800;
    background:#fff; border:1px solid var(--line); border-radius:10px; outline:none;
    font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums}
  .row input:focus{border-color:#c9b48a; box-shadow:0 0 0 3px rgba(176,138,62,.16)}
  .row select{min-height:44px; padding:8px 30px 8px 12px; border:1px solid var(--line); border-radius:10px; background-color:#fff; font-size:13px}

  .field{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0 2px; flex-wrap:wrap}
  .lbl{font-size:12px; color:var(--muted); font-weight:700}
  .seg{display:flex; gap:4px; padding:3px; border-radius:12px; background:#f5eee1; border:1px solid var(--line)}
  .seg button{padding:7px 12px; border-radius:9px; font-size:12px; font-weight:700; color:var(--ink2)}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 2px 6px -2px rgba(90,74,44,.35)}

  /* 汇率 */
  .rates{padding-top:4px}
  .rrow{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:12.5px; color:var(--ink2)}
  .rrow .cur{font-weight:800; color:var(--ink); min-width:62px}
  .rrow input{width:98px; min-height:38px; padding:6px 9px; text-align:right;
    border:1px solid var(--line); border-radius:9px; background:#fff; outline:none; font-weight:700;
    font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums}
  .rrow input:focus{border-color:#c9b48a; box-shadow:0 0 0 3px rgba(176,138,62,.16)}
  .norate{font-size:12px; color:var(--muted); margin:2px 0 0}
  .hint{font-size:11.5px; color:var(--muted); margin:8px 0 0; line-height:1.7}

  /* 汇总 */
  .sum{padding:12px 0 2px}
  .sum .line{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; font-size:13.5px; color:var(--ink2)}
  .sum .line b{font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums; font-size:15px; color:var(--ink)}
  .sum .line.minus b{color:var(--green)}
  .sum .line.big{margin-top:8px; padding-top:12px; border-top:2px solid var(--ink); font-size:14px; font-weight:900; color:var(--ink)}
  .sum .line.big b{font-size:22px; letter-spacing:.5px}

  /* 明细 */
  .drow{display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line)}
  .drow:last-child{border-bottom:none}
  .drow .dn{font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .drow .dn em{font-style:normal; font-size:11px; color:var(--muted); font-weight:400}
  .tag{font-size:9.5px; font-weight:900; letter-spacing:.08em; color:#fff; padding:2px 6px; border-radius:5px; background:var(--red)}
  .drow .dm{text-align:right; font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums; font-size:15px; font-weight:800}
  .drow .dm small{display:block; font-size:10px; color:var(--muted); font-weight:400}
  .drow .pay{font-size:10.5px; font-weight:800; color:var(--gold); border:1px solid #e3cf9f; background:#fffaf0; padding:4px 8px; border-radius:8px; white-space:nowrap}
  .drow.is-payer .dm{color:var(--red)}

  .transfers{display:flex; flex-direction:column; gap:9px}
  .tline{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13.5px}
  .tline .amt{font-family:"SFMono-Regular","Menlo","Consolas","Courier New",monospace; font-variant-numeric:tabular-nums; font-weight:900; font-size:16px; color:var(--red)}
  .tline .who b{font-weight:800}
  .none{font-size:12.5px; color:var(--muted)}
  .payer-note{font-size:11.5px; color:var(--muted); margin:10px 0 0; line-height:1.8}

  .sign-row{display:flex; justify-content:flex-end; padding:6px 4px 2px}
  .stamp{
    transform:rotate(-9deg); border:2.5px solid rgba(212,85,58,.6); color:rgba(212,85,58,.7);
    font-size:11px; font-weight:900; letter-spacing:.22em; padding:6px 10px; border-radius:6px;
    opacity:.85; pointer-events:none;
  }

  .btn-copy{width:100%; min-height:52px; margin-top:6px; border-radius:12px; background:var(--ink); color:#fff9ec; font-size:15px; font-weight:900; letter-spacing:.1em}
  .btn-copy:active{transform:translateY(1px)}
  .btn-save{
    width:100%; min-height:48px; margin-top:10px; border-radius:12px;
    background:linear-gradient(180deg,#c9a45c,#a97f36); color:#fff8e8; font-size:14px; font-weight:900; letter-spacing:.08em;
    box-shadow:0 4px 0 #8a6526;
  }
  .btn-save:active{transform:translateY(2px); box-shadow:0 2px 0 #8a6526}
  .btn-reset{width:100%; min-height:46px; margin-top:10px; border-radius:12px; border:1px solid var(--line); color:var(--ink2); font-size:13px; font-weight:700; background:#fffdf6}

  .recs .rec{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px dashed var(--line)}
  .recs .rec:last-child{border-bottom:none}
  .rec .rinfo{font-size:11.5px; color:var(--muted); line-height:1.6}
  .rec .rinfo b{display:block; font-size:13px; color:var(--ink); font-weight:800}
  .rec .racts{display:flex; gap:6px; flex:none}
  .rec .racts button{font-size:11px; font-weight:800; padding:6px 9px; border-radius:8px; border:1px solid var(--line); background:#fffdf6; color:var(--ink2)}
  .rec .racts .delr{color:var(--red); border-color:#f0cdc4}
  .empty{font-size:12px; color:var(--muted); margin:2px 0 0}
  .foot{text-align:center; font-size:11px; color:var(--muted); margin-top:18px; line-height:1.9}
  .warn{font-size:11.5px; color:var(--red); margin:6px 0 0}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand mono">SPLIT.IT / 拼单台</div>
    <h1>拼单计算器</h1>
    <p class="sub">多币种 · 带类别和备注 · 可以留档</p>
  </header>

  <main class="receipt">
    <div class="r-head">
      <div class="shop">拼单小票</div>
      <div class="meta mono" id="meta"></div>
    </div>

    <section class="sec">
      <div class="sec-title">本次消费</div>
      <div class="grid2">
        <label class="fld"><span>消费日期</span><input type="date" id="date"></label>
        <label class="fld"><span>类别</span><select id="cat"></select></label>
        <label class="fld full"><span>这次拼的是什么</span><input id="note" maxlength="30" placeholder="周五晚饭 / 一起回南京的车票"></label>
      </div>
    </section>

    <div class="dash"></div>

    <section class="sec">
      <div class="sec-title">成员与金额</div>
      <div id="people"></div>
      <button class="add" id="add">+ 添加一个人</button>
    </section>

    <div class="dash"></div>

    <section class="sec">
      <div class="sec-title">优惠与运费</div>
      <div class="row">
        <label>优惠金额（满减 / 券）</label>
        <input id="discount" inputmode="decimal" value="12" class="mono">
      </div>
      <div class="row">
        <label>运费 / 打包费</label>
        <input id="ship" inputmode="decimal" value="9" class="mono">
      </div>
      <div class="field">
        <span class="lbl">优惠怎么分</span>
        <div class="seg" data-key="dmode">
          <button data-v="ratio" class="on">按金额比例</button>
          <button data-v="even">平均分</button>
        </div>
      </div>
      <div class="field">
        <span class="lbl">运费怎么分</span>
        <div class="seg" data-key="smode">
          <button data-v="even" class="on">平均分</button>
          <button data-v="ratio">按金额比例</button>
        </div>
      </div>
      <div class="warn" id="warn"></div>
    </section>

    <div class="dash"></div>

    <section class="sec">
      <div class="sec-title">结算与汇率</div>
      <div class="row">
        <label>结算货币（汇总用）</label>
        <select id="base"></select>
      </div>
      <div class="rates" id="rates"></div>
      <p class="hint">汇率以人民币为基准，用来把外币折成同一种钱；数字可以手动改，只影响本地计算。</p>
    </section>

    <div class="dash"></div>

    <section class="sum">
      <div class="line"><span>总单</span><b id="s-total">¥0.00</b></div>
      <div class="line minus"><span>优惠</span><b id="s-discount">-¥0.00</b></div>
      <div class="line"><span>运费</span><b id="s-ship">+¥0.00</b></div>
      <div class="line big"><span>应收合计</span><b id="s-pay">¥0.00</b></div>
    </section>

    <div class="dash"></div>

    <section class="sec">
      <div class="sec-title">每人应付</div>
      <div id="detail"></div>
      <p class="payer-note">点右边的「让 TA 先付」，标记谁先把钱付给商家</p>
    </section>

    <div class="dash"></div>

    <section class="sec">
      <div class="sec-title">转账清单</div>
      <p class="payer-note" style="margin:0 0 10px">一个人先把钱付给商家，其他人再把各自那份转给 TA</p>
      <div id="transfers" class="transfers"></div>
    </section>

    <div class="sign-row"><div class="stamp">已 拼 单</div></div>
    <button class="btn-copy" id="copy">复制账单文字</button>
    <button class="btn-save" id="save">保存这一单</button>

    <div class="dash"></div>

    <section class="sec">
      <div class="sec-title">历史记录</div>
      <div id="recs" class="recs"><p class="empty">还没有保存过账单</p></div>
    </section>

    <button class="btn-reset" id="reset">清空重来</button>
    <p class="foot">金额按分计算，尾差已自动补齐<br>记录存在本机浏览器里，换设备不会同步</p>
  </main>
</div>

<script>
(function(){
  "use strict";

  var LS_KEY = "splitbill.records.v1";

  var CUR = {
    CNY:{sym:"¥",  name:"人民币"},
    USD:{sym:"$",  name:"美元"},
    HKD:{sym:"HK$",name:"港币"},
    EUR:{sym:"€",  name:"欧元"},
    JPY:{sym:"JP¥",name:"日元"},
    GBP:{sym:"£",  name:"英镑"},
    KRW:{sym:"₩",  name:"韩元"},
    THB:{sym:"฿",  name:"泰铢"}
  };

  // 1 外币 = ? 人民币
  var RATES_CNY = { CNY:1, USD:7.15, HKD:0.92, EUR:7.80, JPY:0.048, GBP:9.05, KRW:0.0052, THB:0.20 };

  var CATS = ["餐饮","车票 · 交通","打车","超市采购","住宿","娱乐","房租水电","其他"];

  function today(){
    var d = new Date();
    var p = function(n){ return n < 10 ? "0" + n : "" + n; };
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
  }

  var state = {
    date: today(),
    cat: "餐饮",
    note: "周五晚饭",
    base: "CNY",
    rates: {},
    people: [
      { name:"阿花", amt:"58", cur:"CNY", note:"" },
      { name:"小李", amt:"32", cur:"CNY", note:"" },
      { name:"老王", amt:"24", cur:"CNY", note:"" }
    ],
    discount: "12",
    ship: "9",
    dmode: "ratio",
    smode: "even",
    payer: 0
  };

  var $ = function(id){ return document.getElementById(id); };

  function toCents(v){
    var s = String(v == null ? "" : v).replace(/[^\d.]/g,"");
    if(!s) return 0;
    var f = parseFloat(s);
    if(!isFinite(f) || f < 0) return 0;
    return Math.round(f * 100);
  }
  function fmt(cents, cur){
    var c = cur || state.base;
    var sym = (CUR[c] && CUR[c].sym) || "";
    return sym + (cents/100).toFixed(2);
  }
  function rateOf(cur){
    if(cur === "CNY") return 1;
    var v = parseFloat(state.rates[cur]);
    if(isFinite(v) && v > 0) return v;
    return RATES_CNY[cur] || 1;
  }
  function toBase(amountCents, cur){
    return Math.round(amountCents * rateOf(cur) / rateOf(state.base));
  }

  function splitPool(pool, weights, mode){
    var n = weights.length, out = new Array(n), i, j;
    for(i=0;i<n;i++) out[i] = 0;
    if(n === 0 || pool <= 0) return out;

    var total = 0, elig = [];
    for(i=0;i<n;i++){
      total += weights[i];
      if(weights[i] > 0) elig.push(i);
    }
    if(!elig.length) return out;

    if(mode === "even" || total <= 0){
      var left = pool, act = elig.slice();
      while(left > 0 && act.length){
        var base = Math.floor(left / act.length), extra = left % act.length, moved = 0;
        for(j=0;j<act.length;j++){
          var idx = act[j];
          var want = base + (j < extra ? 1 : 0);
          var room = weights[idx] - out[idx];
          var give = Math.min(want, room, left - moved);
          out[idx] += give;
          moved += give;
        }
        left -= moved;
        act = act.filter(function(k){ return out[k] < weights[k]; });
        if(moved === 0) break;
      }
      return out;
    }

    var given = 0;
    for(i=0;i<elig.length;i++){
      j = elig[i];
      out[j] = Math.floor(pool * weights[j] / total);
      given += out[j];
    }
    var rest = pool - given;
    var order = elig.slice();
    order.sort(function(a,b){ return weights[b] - weights[a] || a - b; });
    for(i=0;i<rest;i++) out[order[i % order.length]] += 1;
    return out;
  }

  function compute(){
    var list = state.people.map(function(p, i){
      var cur = p.cur || state.base;
      var amt = toCents(p.amt);
      return {
        name: (p.name || "成员" + (i+1)),
        cur: cur,
        amt: amt,
        base: toBase(amt, cur),
        note: p.note || ""
      };
    });

    var total = 0, i;
    for(i=0;i<list.length;i++) total += list[i].base;

    var discWanted = toCents(state.discount);
    var disc = Math.min(discWanted, total);
    var ship = toCents(state.ship);
    var weights = list.map(function(x){ return x.base; });

    var dShare = splitPool(disc, weights, state.dmode);
    var sShare = splitPool(ship, weights, state.smode);

    var rows = list.map(function(x, k){
      return {
        name: x.name, cur: x.cur, amt: x.amt, note: x.note,
        baseAmt: x.base, disc: dShare[k], ship: sShare[k],
        due: x.base - dShare[k] + sShare[k]
      };
    });

    var payerIdx = Math.min(state.payer, Math.max(rows.length - 1, 0));
    var dueTotal = 0;
    for(i=0;i<rows.length;i++) dueTotal += rows[i].due;

    return {
      rows: rows, total: total, disc: disc, cut: discWanted > total,
      ship: ship, dueTotal: dueTotal, payerIdx: payerIdx
    };
  }

  function renderMeta(){
    var d = new Date();
    var p = function(n){ return n < 10 ? "0" + n : "" + n; };
    $("meta").textContent = (state.date || today()) + "\nNO." + p(d.getHours()) + p(d.getMinutes());
    $("date").value = state.date;
    $("note").value = state.note;
    $("cat").value = state.cat;
    $("base").value = state.base;
  }

  function renderCats(){
    var s = $("cat");
    s.innerHTML = "";
    CATS.forEach(function(c){
      var o = document.createElement("option");
      o.value = c; o.textContent = c;
      s.appendChild(o);
    });
  }

  function renderCurSelect(sel, val){
    sel.innerHTML = "";
    Object.keys(CUR).forEach(function(k){
      var o = document.createElement("option");
      o.value = k; o.textContent = k + " " + CUR[k].name;
      sel.appendChild(o);
    });
    sel.value = val;
  }

  function renderBaseSelect(){
    renderCurSelect($("base"), state.base);
  }

  function renderPeople(){
    var box = $("people");
    box.innerHTML = "";
    state.people.forEach(function(p, i){
      var card = document.createElement("div");
      card.className = "pcard";

      var name = document.createElement("input");
      name.className = "pname";
      name.value = p.name;
      name.placeholder = "成员" + (i+1);
      name.maxLength = 8;
      name.oninput = function(){ p.name = name.value; update(); };

      var amt = document.createElement("input");
      amt.className = "pamt mono";
      amt.inputMode = "decimal";
      amt.value = p.amt;
      amt.placeholder = "0.00";
      amt.oninput = function(){ p.amt = amt.value; update(); };

      var cur = document.createElement("select");
      cur.className = "pcur";
      renderCurSelect(cur, p.cur || state.base);
      cur.onchange = function(){
        p.cur = cur.value;
        renderRates();
        update();
      };

      var del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.setAttribute("aria-label","删除这一行");
      del.onclick = function(){
        if(state.people.length <= 1) return;
        state.people.splice(i, 1);
        if(state.payer >= state.people.length) state.payer = 0;
        renderPeople(); renderRates(); update();
      };

      var note = document.createElement("input");
      note.className = "pnote";
      note.value = p.note || "";
      note.maxLength = 16;
      note.placeholder = "这一条备注（可选，比如：没喝酒）";
      note.oninput = function(){ p.note = note.value; update(); };

      card.appendChild(name);
      card.appendChild(amt);
      card.appendChild(cur);
      card.appendChild(del);
      card.appendChild(note);
      box.appendChild(card);
    });
  }

  function rateCurrencies(){
    var map = {}, out = [];
    function add(c){
      if(c && c !== "CNY" && !map[c]){ map[c] = 1; out.push(c); }
    }
    state.people.forEach(function(p){ add(p.cur || state.base); });
    add(state.base);
    return out;
  }

  function renderRates(){
    var box = $("rates");
    box.innerHTML = "";
    var list = rateCurrencies();
    if(!list.length){
      var p = document.createElement("p");
      p.className = "norate";
      p.textContent = "这一单全部是人民币，不需要汇率。";
      box.appendChild(p);
      return;
    }
    list.forEach(function(c){
      var r = document.createElement("div");
      r.className = "rrow";
      var l = document.createElement("span");
      l.className = "cur";
      l.textContent = "1 " + c;
      var eq = document.createElement("span");
      eq.textContent = "=";
      var inp = document.createElement("input");
      inp.className = "mono";
      inp.inputMode = "decimal";
      inp.value = state.rates[c] != null ? state.rates[c] : (RATES_CNY[c] || 1);
      inp.oninput = function(){ state.rates[c] = inp.value; update(); };
      var unit = document.createElement("span");
      unit.textContent = "CNY";
      r.appendChild(l); r.appendChild(eq); r.appendChild(inp); r.appendChild(unit);
      box.appendChild(r);
    });
  }

  function renderResult(r){
    $("s-total").textContent = fmt(r.total);
    $("s-discount").textContent = "-" + fmt(r.disc);
    $("s-ship").textContent = "+" + fmt(r.ship);
    $("s-pay").textContent = fmt(r.dueTotal);
    $("warn").textContent = r.cut ? "优惠填得比总单还高，已按总单封顶" : "";

    var dbox = $("detail");
    dbox.innerHTML = "";
    r.rows.forEach(function(x, i){
      var row = document.createElement("div");
      row.className = "drow" + (i === r.payerIdx ? " is-payer" : "");

      var n = document.createElement("div");
      n.className = "dn";
      n.textContent = x.name;
      if(i === r.payerIdx){
        var tg = document.createElement("span");
        tg.className = "tag";
        tg.textContent = "先付";
        n.appendChild(tg);
      }
      if(x.note){
        var em = document.createElement("em");
        em.textContent = "· " + x.note;
        n.appendChild(em);
      }

      var m = document.createElement("div");
      m.className = "dm";
      m.textContent = fmt(x.due);
      if(x.cur !== state.base){
        var sm = document.createElement("small");
        sm.textContent = "原 " + fmt(x.amt, x.cur);
        m.appendChild(sm);
      }

      var b = document.createElement("button");
      b.className = "pay";
      b.textContent = i === r.payerIdx ? "TA 先付" : "让 TA 先付";
      b.onclick = function(){ state.payer = i; update(); };

      row.appendChild(n);
      row.appendChild(m);
      row.appendChild(b);
      dbox.appendChild(row);
    });

    var tbox = $("transfers");
    tbox.innerHTML = "";
    var payerName = r.rows.length ? r.rows[r.payerIdx].name : "";
    var others = r.rows.filter(function(x, i){ return i !== r.payerIdx && x.due > 0; });
    if(!r.rows.length){
      tbox.innerHTML = '<p class="none">先添加成员和金额</p>';
    } else if(!others.length){
      tbox.innerHTML = '<p class="none">只有一个人，不需要转账</p>';
    } else {
      others.forEach(function(x){
        var line = document.createElement("div");
        line.className = "tline";
        line.innerHTML = '<div class="who"><b>' + x.name + '</b> 转给 <b>' + payerName + '</b></div>' +
                        '<div class="amt">' + fmt(x.due) + '</div>';
        tbox.appendChild(line);
      });
      var note = document.createElement("p");
      note.className = "payer-note";
      note.textContent = payerName + " 先付 " + fmt(r.dueTotal) + "，其他人转完刚好两清。";
      tbox.appendChild(note);
    }
  }

  function update(){
    renderResult(compute());
  }

  function headerLine(){
    var parts = [state.date || today()];
    if(state.cat) parts.push(state.cat);
    if(state.note) parts.push(state.note);
    return parts.join(" · ");
  }

  function buildText(){
    var r = compute();
    var L = [];
    L.push("【拼单账单】");
    L.push(headerLine());
    L.push("总单 " + fmt(r.total));
    if(r.disc) L.push("优惠 -" + fmt(r.disc));
    if(r.ship) L.push("运费 +" + fmt(r.ship));
    L.push("应收合计 " + fmt(r.dueTotal));
    L.push("----------");
    r.rows.forEach(function(x){
      var line = x.name + "  " + fmt(x.due);
      if(x.cur !== state.base) line += "（原 " + fmt(x.amt, x.cur) + "）";
      if(x.note) line += "  #" + x.note;
      L.push(line);
    });
    var payerName = r.rows.length ? r.rows[r.payerIdx].name : "";
    if(r.rows.length > 1){
      L.push("----------");
      L.push("由 " + payerName + " 先付 " + fmt(r.dueTotal) + "，其他人把钱转给 TA");
    }
    var fx = rateCurrencies();
    if(fx.length){
      var parts = fx.map(function(c){ return "1 " + c + "=" + (state.rates[c] != null ? state.rates[c] : RATES_CNY[c]) + " CNY"; });
      L.push("汇率：" + parts.join("，"));
    }
    return L.join("\n");
  }

  /* ---------- 历史记录 ---------- */
  function loadRecs(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function writeRecs(list){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 30))); }catch(e){}
  }

  function snapshot(){
    var r = compute();
    return {
      id: String(new Date().getTime()),
      date: state.date,
      cat: state.cat,
      note: state.note,
      base: state.base,
      rates: JSON.parse(JSON.stringify(state.rates)),
      people: state.people.map(function(p){ return { name:p.name, amt:p.amt, cur:p.cur || state.base, note:p.note || "" }; }),
      discount: state.discount,
      ship: state.ship,
      dmode: state.dmode,
      smode: state.smode,
      payer: state.payer,
      dueTotal: r.dueTotal
    };
  }

  function renderRecs(){
    var box = $("recs");
    var list = loadRecs();
    box.innerHTML = "";
    if(!list.length){
      box.innerHTML = '<p class="empty">还没有保存过账单</p>';
      return;
    }
    list.forEach(function(rec){
      var row = document.createElement("div");
      row.className = "rec";

      var info = document.createElement("div");
      info.className = "rinfo";
      var title = document.createElement("b");
      title.textContent = (rec.note || rec.cat || "未命名账单");
      info.appendChild(title);
      info.appendChild(document.createTextNode(
        (rec.date || "") + " · " + (rec.cat || "") + " · " + (rec.people ? rec.people.length : 0) + " 人 · 应收 " + fmt(rec.dueTotal || 0, rec.base)
      ));

      var acts = document.createElement("div");
      acts.className = "racts";

      var ld = document.createElement("button");
      ld.textContent = "载入";
      ld.onclick = function(){ restore(rec); };

      var rm = document.createElement("button");
      rm.className = "delr";
      rm.textContent = "删除";
      rm.onclick = function(){
        writeRecs(loadRecs().filter(function(x){ return x.id !== rec.id; }));
        renderRecs();
      };

      acts.appendChild(ld);
      acts.appendChild(rm);
      row.appendChild(info);
      row.appendChild(acts);
      box.appendChild(row);
    });
  }

  function restore(rec){
    state.date = rec.date || today();
    state.cat = rec.cat || "餐饮";
    state.note = rec.note || "";
    state.base = rec.base || "CNY";
    state.rates = rec.rates ? JSON.parse(JSON.stringify(rec.rates)) : {};
    state.people = (rec.people || []).map(function(p){
      return { name:p.name || "", amt:p.amt || "", cur:p.cur || state.base, note:p.note || "" };
    });
    if(!state.people.length) state.people = [{ name:"", amt:"", cur:state.base, note:"" }];
    state.discount = rec.discount != null ? rec.discount : "0";
    state.ship = rec.ship != null ? rec.ship : "0";
    state.dmode = rec.dmode || "ratio";
    state.smode = rec.smode || "even";
    state.payer = Math.min(rec.payer || 0, state.people.length - 1);

    $("discount").value = state.discount;
    $("ship").value = state.ship;
    syncSegs();
    renderBaseSelect();
    renderMeta();
    renderPeople();
    renderRates();
    update();
    window.scrollTo(0,0);
  }

  function syncSegs(){
    var segs = document.querySelectorAll(".seg");
    for(var s=0;s<segs.length;s++){
      var key = segs[s].getAttribute("data-key");
      var btns = segs[s].querySelectorAll("button");
      for(var b=0;b<btns.length;b++){
        btns[b].classList.toggle("on", btns[b].getAttribute("data-v") === state[key]);
      }
    }
  }

  /* ---------- 事件 ---------- */
  $("add").onclick = function(){
    state.people.push({ name:"", amt:"", cur:state.base, note:"" });
    renderPeople(); renderRates(); update();
    var cards = $("people").querySelectorAll(".pcard");
    if(cards.length) cards[cards.length-1].querySelector(".pname").focus();
  };

  $("discount").oninput = function(){ state.discount = this.value; update(); };
  $("ship").oninput = function(){ state.ship = this.value; update(); };

  $("date").onchange = function(){ state.date = this.value; renderMeta(); };
  $("cat").onchange = function(){ state.cat = this.value; };
  $("note").oninput = function(){ state.note = this.value; };

  $("base").onchange = function(){
    state.base = this.value;
    renderPeople(); renderRates(); update();
  };

  var segs = document.querySelectorAll(".seg");
  for(var s=0;s<segs.length;s++){
    (function(seg){
      var key = seg.getAttribute("data-key");
      var btns = seg.querySelectorAll("button");
      for(var b=0;b<btns.length;b++){
        btns[b].onclick = function(){
          for(var k=0;k<btns.length;k++) btns[k].classList.remove("on");
          this.classList.add("on");
          state[key] = this.getAttribute("data-v");
          update();
        };
      }
    })(segs[s]);
  }

  $("copy").onclick = function(){
    var txt = buildText();
    var btn = $("copy");
    var done = function(){
      btn.textContent = "已复制，去粘到群里";
      setTimeout(function(){ btn.textContent = "复制账单文字"; }, 1800);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ alert(txt); });
    } else { alert(txt); }
  };

  $("save").onclick = function(){
    var list = loadRecs();
    list.unshift(snapshot());
    writeRecs(list);
    renderRecs();
    var btn = $("save");
    btn.textContent = "已保存到本机";
    setTimeout(function(){ btn.textContent = "保存这一单"; }, 1500);
  };

  $("reset").onclick = function(){
    state.date = today();
    state.cat = "餐饮";
    state.note = "";
    state.base = "CNY";
    state.rates = {};
    state.people = [{ name:"", amt:"", cur:"CNY", note:"" }];
    state.discount = "0";
    state.ship = "0";
    state.dmode = "ratio";
    state.smode = "even";
    state.payer = 0;
    $("discount").value = "0";
    $("ship").value = "0";
    syncSegs();
    renderBaseSelect();
    renderMeta();
    renderPeople();
    renderRates();
    update();
  };

  // 初始化
  renderCats();
  renderBaseSelect();
  renderMeta();
  state.discount = $("discount").value;
  state.ship = $("ship").value;
  renderPeople();
  renderRates();
  update();
  renderRecs();
})();
</script>
</body>
</html>
